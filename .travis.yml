language: python
python:
  - "2.7"
before_install:
  - sudo apt-add-repository -y ppa:flu-team/`dpkg --print-architecture`
  - sudo apt-get update -qq
  - sudo apt-get install libhdf5-serial-dev pythonflu211
install:
  # (1) Install cython and numexpr externally because the requirements does
  #     work with them
  # (2) Pytables breaks with latest Cython
  #     see https://github.com/PyTables/PyTables/issues/388
  - python -c "from Foam import finiteVolume; print 'ok'"
  - pip install numexpr cython==0.20
  - pip install -r requirements.txt
  - pip install -r dev_requirements.txt
  - pip install -r doc_requirements.txt
  - pip install coveralls
  - python setup.py develop
script:
  - flake8 .
  - coverage run -m unittest discover
after_success:
  - coveralls
