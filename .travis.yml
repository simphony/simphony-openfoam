language: python
python:
  - "2.7"
virtualenv:
  system_site_packages: true

env:
  - SIMPHONY_VERSION=0.1.2
  - SIMPHONY_VERSION=master

matrix:
  allow_failures:
    - env: SIMPHONY_VERSION=master

before_install:
  - sudo sh -c "echo deb http://www.openfoam.org/download/ubuntu precise main > /etc/apt/sources.list.d/openfoam.list"
  - sudo add-apt-repository ppa:cython-dev/master-ppa -y
  - sudo apt-get update -qq
  - sudo apt-get install -y --force-yes openfoam222
  - sudo apt-get install libhdf5-serial-dev cython
  - pip install numpy # pyfoam requires numpy
  - . /opt/openfoam222/etc/bashrc
  - ./install_external.sh
  - pip install numexpr
  - pip install git+https://github.com/simphony/simphony-common.git@${SIMPHONY_VERSION}#egg=simphony

  - pip install -r dev_requirements.txt
  - pip install coveralls
  - ./install_foam_interface.sh
install:
  - python setup.py develop

script:
  - coverage run -m unittest discover
  - flake8 .

after_success:
  - coveralls
